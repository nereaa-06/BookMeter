<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />
    <title>BookMeter sin conexión</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #64748b;
        --primary: #0f766e;
        --border: #d6e1ee;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(15, 118, 110, 0.12), transparent 36%),
          linear-gradient(180deg, #f8fbfd 0%, var(--bg) 100%);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(100%, 420px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      .badge {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f766e, #1e3a5f);
        color: white;
        font-size: 30px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">B</div>
      <h1>Estás sin conexión</h1>
      <p>
        BookMeter puede abrir algunas pantallas ya cacheadas, pero ahora mismo no hay red.
        Vuelve a conectarte para ver el mapa y los libros más recientes.
      </p>
      <a class="button" href="/">Reintentar</a>
    </main>
  </body>
</html>
